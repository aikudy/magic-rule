# Clash Meta 配置文件示例
# 适用于 Mihomo、Nikki 等 Clash Meta 客户端
# 编写规则集参考：https://clash.wiki/
# update: 2026-06-09

# 机场订阅
proxy-providers:
  Yesha:
    # 模板占位：提交到仓库时保留空值，实际使用时再替换为真实订阅地址，避免泄露凭据。
    url: "placeholder_url"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 静态节点
proxies:
  - {name: 直连, type: direct}

# 全局配置
mixed-port: 7890
allow-lan: false
# 多平台模板默认只监听本机，避免误开局域网代理入口。
bind-address: 127.0.0.1
ipv6: true
log-level: info
mode: rule
# find-process-mode: 'off'
# global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# DNS 设置 (Fake-IP 模式)
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  # 53 端口在桌面系统上容易与系统服务冲突；1053 作为模板更适合多平台客户端直接导入。
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # 这里保留“黑名单”模式：命中列表的域名返回真实 IP，其余域名返回 Fake-IP。
  # 这样可以兼顾 DNS 防污染与局域网/直连服务的兼容性。
  fake-ip-filter:
    - "geosite:connectivity-check"
    - "geosite:private"
    - "rule-set:my_direct_domain"
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
  default-nameserver: # 解析 nameserver 和 fallback 里面的域名（非 IP 的那种情况）
    - 1.2.4.8
    - 223.5.5.5
    - 119.29.29.29
  # 代理节点域名必须优先稳定解析，使用国内 DoH 的官方域名。
  # 不要把 DoH 写成 https://IP/dns-query：TLS 证书/SNI 通常与 IP 不匹配，
  # 会导致节点域名解析失败，进而表现为多数节点不可用。
  proxy-server-nameserver: # 用来解析代理节点的域名
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 明确把私有域名、国内域名和你手动指定的直连域名交给国内 DNS 解析。
  nameserver-policy:
    "rule-set:private_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:cn_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:my_direct_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  # 默认 nameserver 使用国内 DoH；如果命中海外域名或返回结果疑似污染，再切到 fallback。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # fallback 使用海外 DoH，并通过代理发起查询，避免直连请求海外 DNS 时再次被污染或阻断。
  fallback:
    - "https://dns.google/dns-query#🚀 节点选择"
    - "https://cloudflare-dns.com/dns-query#🚀 节点选择"
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - geolocation-!cn

# TUN 设置
tun:
  enable: false
  stack: system
  # 这里与 dns.listen 保持一致，后续如果开启 TUN，DNS 劫持会落到本地 1053。
  dns-hijack:
    - 127.0.0.1:1053
  device: utun1024 #网卡名称，可修改为utun0或tun0等
  auto-route: true
  strict-route: false # 是否启用严格路由
  auto-detect-interface: true
  mtu: 1500 # 最大传输单元

# 策略组
proxy-groups:
  # 主开关
  - name: 🚀 节点选择
    type: select
    # 主代理组不再提供“直连”，避免把国外流量和未知流量误切为直连。
    proxies: [♻️ 自动选择, 🇭🇰 香港自动, 🇨🇳 台湾自动, 🇯🇵 日本自动, 🇰🇷 韩国自动, 🇸🇬 狮城自动, 🇺🇲 美国自动, 🇭🇰 香港手动, 🇨🇳 台湾手动, 🇯🇵 日本手动, 🇰🇷 韩国手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点]

  # 场景策略
  - name: 🌾 Google
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港自动, 🇨🇳 台湾自动, 🇯🇵 日本自动, 🇰🇷 韩国自动, 🇸🇬 狮城自动, 🇺🇲 美国自动]

  - name: 🤖 人工智能
    type: select
    proxies: [🚀 节点选择, 🇯🇵 日本自动, 🇰🇷 韩国自动, 🇸🇬 狮城自动, 🇺🇲 美国自动]

  - name: 📺 国际媒体
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港自动, 🇨🇳 台湾自动, 🇯🇵 日本自动, 🇰🇷 韩国自动, 🇸🇬 狮城自动, 🇺🇲 美国自动]
  - name: 📲 即时通讯
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港自动, 🇨🇳 台湾自动, 🇯🇵 日本自动, 🇰🇷 韩国自动, 🇸🇬 狮城自动, 🇺🇲 美国自动]

  - name: 🏯 Explorer
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港自动, 🇨🇳 台湾自动, 🇰🇷 韩国自动, 🇸🇬 狮城自动, 🇺🇲 美国自动]

  # 自动选择与筛选
  - name: ♻️ 自动选择
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "^(?!.*(网址|发布|直连|剩余|到期|过期|官网|更新|群|游戏)).*$"

  - {name: 🇭🇰 香港手动, type: select, include-all: true, filter: "(?i)(港|HK|Hong Kong)"}
  - {name: 🇨🇳 台湾手动, type: select, include-all: true, filter: "(?i)(台|TW|Taiwan)"}
  - {name: 🇯🇵 日本手动, type: select, include-all: true, filter: "(?i)(日|JP|Japan)"}
  - {name: 🇰🇷 韩国手动, type: select, include-all: true, filter: "(?i)(韩|KR|Korea)"}
  - {name: 🇸🇬 狮城手动, type: select, include-all: true, filter: "(?i)(新加|坡|SG|Singapore)"}
  - {name: 🇺🇲 美国手动, type: select, include-all: true, filter: "(?i)(美|US|States)"}
  - {name: 🇭🇰 香港自动, type: fallback, url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 50, include-all: true, filter: "(?i)(港|HK|Hong Kong)"}
  - {name: 🇨🇳 台湾自动, type: fallback, url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 50, include-all: true, filter: "(?i)(台|TW|Taiwan)"}
  - {name: 🇯🇵 日本自动, type: fallback, url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 50, include-all: true, filter: "(?i)(日|JP|Japan)"}
  - {name: 🇰🇷 韩国自动, type: fallback, url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 50, include-all: true, filter: "(?i)(韩|KR|Korea)"}
  - {name: 🇸🇬 狮城自动, type: fallback, url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 50, include-all: true, filter: "(?i)(新加|坡|SG|Singapore)"}
  - {name: 🇺🇲 美国自动, type: fallback, url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 50, include-all: true, filter: "(?i)(美|US|States)"}
  - {name: 🌐 全部节点, type: select, include-all: true, filter: "^(?!.*(网址|发布|直连|剩余|到期|过期|官网|更新|群|游戏)).*$"}

# 分流规则逻辑
rules:
  # 局域网与直连
  - RULE-SET,private_ip,直连,no-resolve
  # 你的自定义直连 IP 网段，例如家用 NAS、公司内网出口、固定回国线路。
  - RULE-SET,my_direct_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - RULE-SET,my_direct_domain,直连
  - RULE-SET,apple_domain,直连
  - RULE-SET,apple_ip,直连
  - RULE-SET,speedtest_domain,直连
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连

  # --- 代理规则 ---
  # 你的自定义代理 IP 网段，例如海外服务固定出口、IP 直连型服务。
  - RULE-SET,my_proxy_ip,🚀 节点选择,no-resolve
  - RULE-SET,my_proxy_domain,🚀 节点选择
  - RULE-SET,ai,🤖 人工智能
  - RULE-SET,youtube_domain,📺 国际媒体
  - RULE-SET,netflix_domain,📺 国际媒体
  - RULE-SET,netflix_ip,📺 国际媒体
  # PayPal 更接近海外服务，按“国外优先代理”的总原则放到代理侧更稳妥。
  - RULE-SET,paypal_domain,🚀 节点选择
  - RULE-SET,tiktok_domain,📺 国际媒体
  - RULE-SET,telegram_domain,📲 即时通讯
  - RULE-SET,telegram_ip,📲 即时通讯
  - RULE-SET,whatsapp_domain,📲 即时通讯
  - RULE-SET,github_domain,🚀 节点选择
  - RULE-SET,google_domain,🌾 Google
  - RULE-SET,google_ip,🌾 Google
  - RULE-SET,javdb_domain,🏯 Explorer
  - RULE-SET,javbus_domain,🏯 Explorer
  - RULE-SET,geolocation-!cn,🚀 节点选择

  # 兜底
  # 无法判定国内还是国外时，直接交给主代理组，显式满足“未知默认代理”。
  - MATCH,🚀 节点选择

# 规则集定义 (Rule Providers)
rule-providers:
  # --- 你的自定义 GitHub 文件 ---
  my_direct_domain:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/aikudy/magic-rule/refs/heads/master/rules/private-direct-domain.yaml"
    path: ./ruleset/my_direct_domain.yaml
    interval: 86400

  my_proxy_domain:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/aikudy/magic-rule/refs/heads/master/rules/private-proxy-domain.yaml"
    path: ./ruleset/my_proxy_domain.yaml
    interval: 86400

  my_direct_ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://raw.githubusercontent.com/aikudy/magic-rule/refs/heads/master/rules/private-direct-ip.yaml"
    path: ./ruleset/my_direct_ip.yaml
    interval: 86400

  my_proxy_ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://raw.githubusercontent.com/aikudy/magic-rule/refs/heads/master/rules/private-proxy-ip.yaml"
    path: ./ruleset/my_proxy_ip.yaml
    interval: 86400

  # --- 公共规则集 (MetaCubeX) ---

  private_domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
    path: ./ruleset/private_domain.mrs
    interval: 86400

