# Clash Meta 配置文件示例
# 适用于 Mihomo、Nikki 等 Clash Meta 客户端
# 编写规则集参考：https://clash.wiki/

# 机场订阅
proxy-providers:
  Yesha:
    url: "~"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 静态节点
proxies:
  - {name: 直连, type: direct}

# 全局配置
mixed-port: 7890
allow-lan: false
bind-address: "*"
ipv6: true
log-level: info
mode: rule
# find-process-mode: 'off'
# global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# DNS 设置 (Fake-IP 模式)
dns:
  enable: true
  ipv6: true
  prefer-h3: true
  listen: 127.0.0.1:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "geosite:connectivity-check"
    - "geosite:private"
  default-nameserver: # 解析 nameserver 和 fallback 里面的域名（非 IP 的那种情况）
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
  proxy-server-nameserver: # 用来解析代理节点的域名
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver:
    - "https://8.8.8.8/dns-query#PROXY&ecs=120.76.0.0/14&ecs-override=true"

# TUN 设置
tun:
  enable: true
  stack: system
  dns-hijack: # dns劫持端口
    - 127.0.0.1:53
  device: utun1024 #网卡名称，可修改为utun0或tun0等
  auto-route: true
  strict-route: false # 是否启用严格路由
  auto-detect-interface: true
  mtu: 1500 # 最大传输单元

# 策略组
proxy-groups:
  # 主开关
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, 直连]

  # 场景策略
  - name: 🌾 Google
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

  - name: 🤖 人工智能
    type: select
    proxies: [🚀 节点选择, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

  - name: 📺 国际媒体
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]
  - name: 📲 即时通讯
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

  - name: 🏯 Explorer
    type: select
    proxies: [🇭🇰 香港节点, 🇨🇳 台湾节点, 🇰🇷 韩国节点, 🇸🇬 狮城节点, 🇺🇲 美国节点]

  # 自动选择与筛选
  - name: ♻️ 自动选择
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "^(?!.*(网址|发布|直连|剩余|到期|过期|官网|更新|群|游戏)).*$"

  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)(港|HK|Hong Kong)"}
  - {name: 🇨🇳 台湾节点, type: select, include-all: true, filter: "(?i)(台|TW|Taiwan)"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)(日|JP|Japan)"}
  - {name: 🇰🇷 韩国节点, type: select, include-all: true, filter: "(?i)(韩|KR|Korea)"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?i)(新加|坡|SG|Singapore)"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)(美|US|States)"}
  - {name: 🌐 全部节点, type: select, include-all: true, filter: "^(?!.*(网址|发布|直连|剩余|到期|过期|官网|更新|群|游戏)).*$"}

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, 直连]

# 分流规则逻辑
rules:
  # 局域网与直连
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - RULE-SET,my_direct_domain,直连
  - RULE-SET,apple_domain,直连
  - RULE-SET,apple_ip,直连
  - RULE-SET,speedtest_domain,直连
  - RULE-SET,paypal_domain,直连
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连

  # --- 代理规则 ---
  - RULE-SET,my_proxy_domain,🚀 节点选择
  - RULE-SET,ai,🤖 人工智能
  - RULE-SET,youtube_domain,📺 国际媒体
  - RULE-SET,netflix_domain,📺 国际媒体
  - RULE-SET,netflix_ip,📺 国际媒体
  - RULE-SET,tiktok_domain,📺 国际媒体
  - RULE-SET,telegram_domain,📲 即时通讯
  - RULE-SET,telegram_ip,📲 即时通讯
  - RULE-SET,whatsapp_domain,📲 即时通讯
  - RULE-SET,github_domain,🚀 节点选择
  - RULE-SET,google_domain,🌾 Google
  - RULE-SET,google_ip,🌾 Google
  - RULE-SET,javdb_domain,🏯 Explorer
  - RULE-SET,javbus_domain,🏯 Explorer
  - RULE-SET,geolocation-!cn,🚀 节点选择

  # 兜底
  - MATCH,🐟 漏网之鱼

# 规则集定义 (Rule Providers)
rule-providers:
  # --- 你的自定义 GitHub 文件 ---
  my_direct_domain:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/aikudy/magic-rule/refs/heads/master/rules/private-direct-domain.yaml"
    path: ./ruleset/my_direct_domain.yaml
    interval: 86400

  my_proxy_domain:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/aikudy/magic-rule/refs/heads/master/rules/private-proxy-domain.yaml"
