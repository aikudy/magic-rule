# 私有直连域名列表
# DOMAIN,aaa.com：只想命中单个具体域名时用（最精确）。
# DOMAIN-SUFFIX,aaa.com：想命中该域名及其所有子域名时用（最常用）。
# DOMAIN-KEYWORD,xxx：域名包含 xxx 就命中（范围最大，最容易误命中）

payload:
  # 内网域名（如公司/家里自建域名）
  - DOMAIN-SUFFIX,lan
  - DOMAIN-SUFFIX,local
  - DOMAIN-SUFFIX,home.arpa

  # 路由器/旁路由/NAS 常见域名（按需保留）
  - DOMAIN,router.asus.com
  - DOMAIN-SUFFIX,synology.com
  - DOMAIN-SUFFIX,qnap.com

  # 自己的服务
  # - DOMAIN,git.example.com
  # - DOMAIN-SUFFIX,example.internal

  # 常见国内直连
  - DOMAIN-SUFFIX,hcfy.ai
